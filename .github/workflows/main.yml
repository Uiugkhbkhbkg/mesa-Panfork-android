name: build-mesa-panfork

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install dependencies (Full Stack)
        run: |
          PACKAGES_TO_INSTALL="
            git wget meson ninja-build python3 xwayland clang cmake gcc pkg-config
            libdrm-dev libexpat1-dev libx11-dev libxext-dev libxcb1-dev
            libxcb-dri2-0-dev libxcb-dri3-dev libxcb-present-dev
            libxcb-sync-dev libxshmfence-dev libxxf86vm-dev
            libzstd-dev zlib1g-dev libwayland-dev wayland-protocols
            libelf-dev libunwind-dev libomxil-bellagio-dev
            libudev-dev libglvnd-dev libva-dev
            libvdpau-dev libclang-dev libpciaccess-dev
          "
          sudo apt-get update
          echo "Checking if all packages are available..."
          for pkg in $PACKAGES_TO_INSTALL; do
            if ! apt-cache policy "$pkg" | grep -q "Candidate:"; then
              echo "Error: Unable to locate package '$pkg'. It may have been removed from the repository for this Ubuntu version."
              exit 1
            fi
          done
          echo "All packages found. Proceeding with installation."
          sudo apt-get install -y $PACKAGES_TO_INSTALL
          pip3 install mako setuptools

      - name: Fake wayland-egl-backend for pkg-config
        run: |
          mkdir -p fake-pkgconfig
          cat <<EOF > fake-pkgconfig/wayland-egl-backend.pc
          prefix=/usr
          exec_prefix=${prefix}
          libdir=${exec_prefix}/lib
          includedir=${prefix}/include
          Name: wayland-egl-backend
          Description: Fake wayland-egl-backend stub
          Version: 1.0.0
          EOF
          echo "PKG_CONFIG_PATH=$GITHUB_WORKSPACE/fake-pkgconfig:$PKG_CONFIG_PATH" >> $GITHUB_ENV

      - name: Setup Android NDK
        run: |
          wget https://dl.google.com/android/repository/android-ndk-r27c-linux.zip
          unzip android-ndk-r27c-linux.zip
          mv android-ndk-r27c ndk
          echo "NDK=$PWD/ndk" >> $GITHUB_ENV
          echo "TOOLCHAIN=$PWD/ndk/toolchains/llvm/prebuilt/linux-x86_64" >> $GITHUB_ENV

      - name: Clone mesa-panfork
        run: |
          git clone https://github.com/anonymususer04/mesa-Panfork-android.git

      - name: Build mesa with meson
        run: |
          export PATH=$TOOLCHAIN/bin:$PATH
          export ARCH=aarch64
          export TOOL=$ARCH-linux-android26
          export CC=$TOOL-clang
          export CXX=$TOOL-clang++
          mkdir mesa-install
          cd mesa-Panfork-android
          meson setup build \
            --cross-file ../mesa-cross.txt \
            -Dgallium-drivers=panfrost,swrast \
            -Dvulkan-drivers= \
            -Dbuildtype=release \
            -Dllvm=disabled \
            -Dplatforms=x11,wayland \
            -Dprefix=$GITHUB_WORKSPACE/mesa-install
          ninja -C build install

      - name: Package build output
        run: |
          tar -czf mesa-panfork.tar.gz -C mesa-install .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mesa-panfork
          path: mesa-panfork.tar.gz